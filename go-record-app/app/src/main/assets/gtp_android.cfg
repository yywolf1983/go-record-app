# 自动打包进 App 的 KataGo 配置（由围棋打谱 App 生成）
# model 路径会在运行时被重写为应用私有缓存中的模型文件
model = kata1-b20c256x2-s5303129600-d1228401921.bin.gz

maxVisits = 500
numSearchThreads = 2
nnBatchSize = 8

defaultThinkTime = 5.0
maxThinkTime = 30.0

rules = chinese
boardSize = 19

# JNI / lib 编译时固定使用 EIGEN 后端（纯 CPU，无需 OpenCL / libOpenCL.so）
backend = eigen

logLevel = WARNING
reportAnalysisWinrates = true

conservativePlay = true
wideBNCache = false
maxMCEValueCacheMB = 64
