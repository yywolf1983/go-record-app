# 自动打包进 App 的 KataGo 配置（由围棋打谱 App 生成）
# model 路径会在运行时被重写为应用私有缓存中的模型文件
# 提速提示：当前为最大的 b20c256x2 模型，纯 CPU(EIGEN) 下极慢。
# 换用更小模型可快数倍：b10c256（约 2.5x）、b6c96（约 4x），分析质量对打谱足够。
model = kata1-b20c256x2-s5303129600-d1228401921.bin.gz

maxVisits = 500
# EIGEN 纯 CPU 后端：线程数越多越快（本机 8 核，运行时设置可提到 6~8）。
# 注意运行时 analyze 传入的 numThreads 会覆盖此值。
numSearchThreads = 4
# CPU 推理下 nnBatchSize 不宜过大，8 适中；CPU 核少时可降到 4
nnBatchSize = 8

defaultThinkTime = 5.0
maxThinkTime = 30.0

rules = chinese
boardSize = 19

# 后端：eigen=纯CPU（Mali/联发科/多数设备稳定兼容）。AGM H6 等为 Mali GPU，
# 其 libOpenCL.so 为 vendor 专有库别名，应用 namespace 无法加载，故用 EIGEN。
backend = eigen

logLevel = WARNING
reportAnalysisWinrates = true

conservativePlay = true
wideBNCache = false
maxMCEValueCacheMB = 64
