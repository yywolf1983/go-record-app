plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.gosgf.app'
    compileSdk 34

    // 使用本地已下载的 NDK（由 local.properties 的 ndk.dir 指定，避免 SDK Manager 下载）
    ndkVersion "27.3.13750724"

    defaultConfig {
        applicationId "com.gosgf.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 直接编译 KataGo 源码（含自写 JNI 封装）为 libkatago.so
        externalNativeBuild {
            cmake {
                // KataGo 后端：EIGEN=纯CPU(稳定兼容, 默认)；OPENCL=GPU加速(仅部分设备可用, 见下)
                // 注意：Mali GPU 的 libOpenCL.so 实为 libGLES_mali 别名，强依赖 vendor 专有库链，
                // 应用 namespace 无法加载 → 崩溃。故默认 EIGEN。若要 GPU，需高通 Adreno 等设备，
                // 并改为 OPENCL 且把该设备的 libOpenCL.so 放入 jniLibs/<abi>/。
                arguments '-DUSE_BACKEND=EIGEN',
                          '-DNO_GIT_REVISION=1',
                          '-DEIGEN3_INCLUDE_DIRS=/opt/homebrew/include/eigen3',
                          '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                cppFlags '-std=c++17'
            }
        }

        // 默认 ABI：arm64-v8a（真机常用，避免 x86 编译 KataGo 耗时）。
        // 构建时传 -Pabi=x86 可切换到 x86_64（模拟器）。
        ndk { abiFilters 'arm64-v8a' }
    }

    // assets 为默认路径；libkatago.so 由 externalNativeBuild 自动打包，无需 jniLibs
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    // 模型权重(.bin.gz/.onnx)已压缩，禁止 aapt 二次压缩（避免压缩大文件异常导致文件未进 APK）
    aaptOptions {
        noCompress "gz", "bin.gz", "cfg", "onnx"
    }

    externalNativeBuild {
        cmake {
            // KataGo 源码树中的库构建脚本（CMakeLists.txt 软链到 CMakeLists_library.txt）
            // 直接产出 libkatago.so，含自写 JNI 封装与引擎全部代码
            path '/Users/yy/github/KataGo/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 默认产出统一 APK：app-debug.apk，ABI 默认 arm64-v8a（真机常用，避免 x86 编译 KataGo 耗时）。
    // 如需切到 x86_64（模拟器），构建时传 -Pabi=x86；-Pabi=arm 可显式指定 arm64-v8a。
    if (project.hasProperty('abi')) {
        def abiProp = project.getProperty('abi')
        android.defaultConfig.ndk.abiFilters.clear()
        if (abiProp == 'x86') {
            android.defaultConfig.ndk.abiFilters.add('x86_64')
        } else if (abiProp == 'arm') {
            android.defaultConfig.ndk.abiFilters.add('arm64-v8a')
        } else {
            throw new GradleException("未知 abi: ${abiProp}，支持值: arm | x86")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // 拍照识别：Moku RT-DETR 模型推理 (kaya-go/moku-v3 ONNX)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.0'
    // 相机拍照 URI 访问
    implementation 'androidx.core:core:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation files('libs/registration-lib.aar')
}
